title = "Webhost Billing secret-scanning configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Verified documentation phrases and explicitly fictional test values"
regexTarget = "secret"
regexes = [
  '''^bounce/complaint$''',
  '''^MIME/signature$''',
  '''^signature/MIME$''',
  '''^bKash/SSLCOMMERZ$''',
  '''^test-encryption-key-at-least-32-characters$''',
  '''^abc123def456$''',
  # Authored invoice submission identifier, not an integration credential.
  '''^fictional-invoice-98$''',
  # Verified Git commit IDs in the staging release history, not API keys.
  '''^1985d84105c5663278c897cb02cacf1645b2d0e7$''',
  '''^a516f6ea5d1279abe27f1131899d490cdb8c4cb1$''',
]
