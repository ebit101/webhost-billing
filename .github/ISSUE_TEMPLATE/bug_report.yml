name: Bug report
description: Report a reproducible problem using fictional or redacted data.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, cookies, customer data, payment evidence, database dumps, or unredacted logs. Security vulnerabilities must use private reporting instead.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Tag, image digest, or Git commit SHA.
      placeholder: v0.1.0-alpha.1 or 0123456
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Local pnpm development
        - Docker Compose development
        - Production Compose topology
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node/pnpm versions, browser, PostgreSQL/Redis versions, and relevant provider mode. Redact private details.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use fictional data and the smallest reliable sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
      description: Remove tokens, cookies, personal data, provider payloads, internal hosts, and payment proof.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: I removed all secrets and personal or customer information.
          required: true
        - label: This is not a security vulnerability.
          required: true
