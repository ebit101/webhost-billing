version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Dhaka
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Asia/Dhaka

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Asia/Dhaka

  - package-ecosystem: docker
    directory: /apps/worker
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Asia/Dhaka

  - package-ecosystem: docker
    directory: /deploy/production/nginx
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Asia/Dhaka

  - package-ecosystem: docker
    directory: /deploy/production/migration
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Asia/Dhaka
