name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/docs/ci-change-scope.sh "$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Scan complete Git history for secrets
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --config=/repo/.gitleaks.toml --no-banner --redact

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Activate pinned pnpm
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate

      - name: Install dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify installed development-tooling mitigations
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm test:tooling-security

      - name: Create isolated CI environment
        id: ci_environment
        if: steps.scope.outputs.docs_only != 'true'
        run: cp .env.example .env

      - name: Start PostgreSQL and Redis
        if: steps.scope.outputs.docs_only != 'true'
        run: docker compose up --detach --wait postgres redis

      - name: Prepare and verify database
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          pnpm db:generate
          pnpm db:migrate:deploy
          pnpm db:seed
          pnpm db:verify

      - name: Check formatting
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm format:check

      - name: Check offline documentation
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/docs/check-documentation.mjs

      - name: Check documentation without workspace dependencies
        if: steps.scope.outputs.docs_only == 'true'
        run: |
          node scripts/docs/check-markdown-links.mjs
          node scripts/docs/check-contributor-paths.mjs
          node scripts/docs/check-demo-screenshot-assets.mjs

      - name: Check changed documentation images
        if: steps.scope.outputs.docs_only == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/docs/ci-change-scope.sh "$BASE_SHA" images

      - name: Lint
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm lint

      - name: Prepare backend artifacts for E2E type imports
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          pnpm --filter @webhost-billing/api build
          pnpm --filter @webhost-billing/worker build

      - name: Type check
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm typecheck

      - name: Cache approved image for isolated privilege acceptance
        if: steps.scope.outputs.docs_only != 'true'
        run: docker pull --platform linux/amd64 postgres@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650

      - name: Run package tests
        run: pnpm test
        if: steps.scope.outputs.docs_only != 'true'

      - name: Run API integration tests
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm --filter @webhost-billing/web exec tsx e2e/run-api-tests.ts

      - name: Run isolated WhatsApp database acceptance with blocked external delivery
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm test:whatsapp:database

      - name: Run critical invariant tests
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm test:invariants

      - name: Run isolated backup and recovery acceptance
        if: steps.scope.outputs.docs_only != 'true'
        env:
          COMMAND28_RECOVERY_DRILL_CONFIRMATION: RESET_COMMAND28_FICTIONAL_DATABASES
        run: pnpm backup:test-recovery

      - name: Install Chromium for browser tests
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm --filter @webhost-billing/web exec playwright install --with-deps chromium

      - name: Run browser lifecycle test
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm test:e2e

      - name: Run administrator role browser checks
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm --filter @webhost-billing/web exec playwright test --config playwright.staff.config.ts

      - name: Audit production dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm audit --prod --audit-level high

      - name: Verify production license inventory
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm licenses list --prod > /dev/null

      - name: Build production artifacts
        if: steps.scope.outputs.docs_only != 'true'
        env:
          NODE_ENV: production
        run: pnpm build

      - name: Build production web container
        if: steps.scope.outputs.docs_only != 'true'
        run: >-
          docker build --file apps/web/Dockerfile --target web
          --build-arg NEXT_PUBLIC_API_URL=http://localhost:3001
          --tag webhost-billing-web:ci .

      - name: Stop CI infrastructure
        if: always() && steps.ci_environment.outcome == 'success'
        run: docker compose down

  dependency-review:
    name: Dependency review
    needs: validate
    if: "!cancelled() && github.event_name == 'pull_request' && needs.validate.outputs.docs_only != 'true'"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
