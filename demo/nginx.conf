events {}

error_log stderr notice;

http {
  server_tokens off;
  access_log off;

  upstream demo_web {
    server web:3000;
  }

  upstream demo_api {
    server api:3001;
  }

  server {
    listen 3100;
    server_name localhost;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto http;

    location = /health {
      proxy_pass http://demo_api;
    }

    location = /ready {
      proxy_pass http://demo_api;
    }

    location ~ ^/(auth|background-jobs|customers|dashboard|email-notifications|hosting-panel|orders|payment-gateways|payments|products|renewal-automation|reports|services|settings|tickets|observability)(/|$) {
      proxy_pass http://demo_api;
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }

    location ~ ^/invoices/[^/]+/print/?$ {
      proxy_pass http://demo_web;
    }

    location /invoices {
      proxy_pass http://demo_api;
    }

    location / {
      proxy_pass http://demo_web;
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }
  }
}
