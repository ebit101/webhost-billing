packages:
  - 'apps/*'
  - 'packages/*'
overrides:
  'brace-expansion@^1': 1.1.21
  'brace-expansion@^2': 2.1.7
  'brace-expansion@^5': 5.0.12
  deepmerge-ts: 8.0.0
  fast-uri: 3.1.8
  'js-yaml@^3': 3.15.2
  'js-yaml@^4': 4.3.2
  mysql2: 3.23.1
  qs: 6.16.0
allowBuilds:
  '@prisma/engines': true
  argon2: true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@nestjs/common@11.2.7'
  - '@nestjs/core@11.2.7'
  - '@nestjs/platform-express@11.2.7'
  - '@nestjs/testing@11.2.7'
  - nodemailer@10.0.13
