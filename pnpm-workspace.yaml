packages:
  - 'apps/*'
  - 'packages/*'
overrides:
  'body-parser@^2': 2.4.0
  'brace-expansion@^1': 1.1.21
  'brace-expansion@^2': 2.1.7
  'brace-expansion@^5': 5.0.12
  deepmerge-ts: 8.0.0
  fast-uri: 3.1.9
  handlebars: 4.7.10
  'js-yaml@^3': 3.15.2
  'js-yaml@^4': 4.3.2
  mysql2: 3.23.1
  'multer@^2': 2.5.0
  'proxy-addr@^2.0.7': 2.0.8
  qs: 6.16.1
  'source-map-js@^1.0.0': 1.2.2
allowBuilds:
  '@prisma/engines': true
  argon2: true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@nestjs/common@11.2.7'
  - '@nestjs/core@11.2.7'
  - '@nestjs/platform-express@11.2.7'
  - '@nestjs/testing@11.2.7'
patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
  sprintf-js@1.0.3: patches/sprintf-js@1.0.3.patch
